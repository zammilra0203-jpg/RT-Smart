<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Penjual | RT SMART</title><style>body{font:15px system-ui;background:#f3f6fb;color:#17243a;margin:0}.wrap{max-width:950px;margin:35px auto;padding:0 18px}header{background:#123b65;color:white;padding:22px;border-radius:15px}h1{margin:0}section{background:white;margin-top:18px;padding:22px;border-radius:14px;box-shadow:0 3px 14px #152b4312}label{display:block;margin:12px 0 5px;font-weight:600}input{padding:12px;box-sizing:border-box;border:1px solid #c8d3df;border-radius:8px;width:100%}button{background:#1264a3;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer;margin:9px 7px 0 0}button.alt{background:#5c6778}button.warn{background:#b54747}button:disabled{opacity:.55}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border-bottom:1px solid #dfe6ed;text-align:left;padding:10px;vertical-align:top}small{color:#536477}.scroll{overflow-x:auto}pre{white-space:pre-wrap;word-break:break-word;background:#f0f5fa;padding:15px;border-radius:8px}a{color:#145c9b} .actions button{font-size:12px;padding:7px;margin:2px}</style></head><body><div class="wrap"><header><h1>RT SMART — Admin Penjual</h1><p>Kelola lisensi dan perangkat pelanggan. Kunci admin tidak disimpan di browser.</p></header><section><label for="secret">Kunci Rahasia Admin Cloudflare</label><input type="password" id="secret" autocomplete="off" placeholder="Masukkan RT_SMART_ADMIN_SECRET"><button id="load">Muat Daftar Lisensi</button><small>Gunakan hanya di perangkat pribadi. Jangan bagikan kunci ini kepada pelanggan.</small></section><section><h2>Buat Lisensi Baru</h2><label for="id">ID RT (huruf kecil, angka, tanda hubung)</label><input id="id" placeholder="contoh: rt-desa-baru"><label for="name">Nama RT / Pelanggan</label><input id="name" placeholder="RT 001 Desa Baru"><button id="create">Buat Kode Aktivasi</button><div id="created" aria-live="polite"></div></section><section><h2>Daftar Lisensi</h2><div id="status" aria-live="polite"></div><div class="scroll"><table><thead><tr><th>RT</th><th>Status</th><th>Perangkat</th><th>Dashboard</th><th>Tindakan</th></tr></thead><tbody id="rows"><tr><td colspan="5">Klik “Muat Daftar Lisensi”.</td></tr></tbody></table></div></section></div><script>
const API='https://startwithhelloworld.aplikasirt1.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,method='GET',body){const secret=$('secret').value.trim();if(!secret)throw Error('Masukkan kunci admin terlebih dahulu.');const res=await fetch(API+path,{method,headers:{Authorization:'Bearer '+secret,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json();if(!res.ok)throw Error(data.error||'Permintaan gagal ('+res.status+')');return data;}
async function load(){ $('status').textContent='Memuat...';try{const d=await request('/admin/list');const rows=d.tenants||[];$('rows').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${esc(x.name||x.id)}</b><br><small>${esc(x.id)}</small></td><td>${esc(x.status||'legacy')}</td><td>${esc(x.devicesUsed??0)} / ${esc(x.deviceLimit??3)}</td><td><a target="_blank" rel="noopener" href="${esc(x.publicUrl)}">Buka dashboard</a></td><td class="actions">${x.legacy?'<small>Lisensi lama dilindungi</small>':`<button data-id="${esc(x.id)}" data-action="toggle">${x.status==='active'?'Nonaktifkan':'Aktifkan'}</button><button class="warn" data-id="${esc(x.id)}" data-action="reset">Reset perangkat</button>`}</td></tr>`).join(''):'<tr><td colspan="5">Belum ada lisensi.</td></tr>';$('status').textContent=rows.length+' RT ditemukan.';}catch(e){$('status').textContent='Gagal: '+e.message;}}
$('load').onclick=load;
$('create').onclick=async()=>{const id=$('id').value.trim().toLowerCase(),name=$('name').value.trim();$('created').textContent='Membuat lisensi...';try{const d=await request('/admin/create','POST',{id,name});$('created').innerHTML=`<pre><b>Lisensi berhasil dibuat!</b>\nID: ${esc(d.id)}\nKode aktivasi: ${esc(d.activationCode)}\nDashboard: ${esc(d.publicUrl)}\n\nSIMPAN kode ini sekarang. Kode hanya ditampilkan sekali.</pre><button id="copyCode">Salin kode</button>`;$('copyCode').onclick=()=>navigator.clipboard.writeText(d.activationCode);await load();}catch(e){$('created').textContent='Gagal: '+e.message;}};
$('rows').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;const message=action==='reset'?`Hapus semua perangkat yang terdaftar untuk ${id}? Pelanggan harus aktivasi ulang.`:`Ubah status lisensi ${id}?`;if(!confirm(message))return;try{if(action==='reset')await request('/admin/reset-devices','POST',{id});else await request('/admin/toggle','POST',{id});await load();}catch(err){alert('Gagal: '+err.message);}};
</script></body></html>
