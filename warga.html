<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Warga RT SMART</title><style>body{margin:0;background:#f2f7f5;color:#18382e;font:16px system-ui,sans-serif}header{background:#087e60;color:white;padding:30px 18px}main{max-width:850px;margin:25px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,article{background:white;border-radius:14px;padding:20px;margin-bottom:12px;box-shadow:0 2px 12px #163e3012}.label{font-size:13px;color:#577267}.value{font-size:24px;font-weight:750;margin-top:8px}h1{margin:0;font-size:27px}small{opacity:.8}h2{margin-top:30px}article h3{margin:0 0 7px}article p{white-space:pre-wrap;overflow-wrap:anywhere}#status{padding:15px;background:white;border-radius:12px}</style></head><body><header><main style="margin:0 auto"><h1 id="title">Dashboard Warga RT SMART</h1><small id="updated">Memuat data publik...</small></main></header><main><p id="status" role="status">Mengambil ringkasan terbaru...</p><div class="cards" id="cards"></div><h2>Pengumuman</h2><div id="announcements"></div></main><script>
const API='https://startwithhelloworld.aplikasirt1.workers.dev';const id=new URLSearchParams(location.search).get('rt')||'';const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');function put(parent,tag,text,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=text;parent.appendChild(el);return el}async function load(){const status=document.getElementById('status');if(!/^[a-z0-9][a-z0-9-]{2,49}$/.test(id)){status.textContent='Link dashboard tidak valid.';return}try{const r=await fetch(API+'/public/'+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Data tidak tersedia');document.getElementById('title').textContent=(d.name||'RT SMART')+' — RT '+(d.rt||'-')+' / RW '+(d.rw||'-');document.getElementById('updated').textContent='Diperbarui: '+new Date(d.updated).toLocaleString('id-ID');status.remove();const cards=document.getElementById('cards');for(const [label,value] of [['Jumlah Warga',d.residents],['Jumlah KK',d.families],['Kas Masuk',rupiah(d.income)],['Kas Keluar',rupiah(d.expense)],['Saldo Kas',rupiah(d.balance)]]){const box=put(cards,'div','','card');put(box,'div',label,'label');put(box,'div',String(value),'value')}const announcements=document.getElementById('announcements');if(!d.announcements?.length){put(announcements,'p','Belum ada pengumuman.');return}for(const a of d.announcements){const art=put(announcements,'article','');put(art,'h3',a.title||'Pengumuman');put(art,'small',a.date||'');put(art,'p',a.body||'')}}catch(e){status.textContent='Dashboard belum tersedia: '+e.message}}load();
</script></body></html>
