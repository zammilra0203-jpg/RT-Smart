const STORE=['settings','families','residents','cash','announcements','letters','archives'];const DBNAME='rt-smart-local-v3';let db,section='Dashboard';let state={settings:[],families:[],residents:[],cash:[],announcements:[],letters:[],archives:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:0});const num=v=>Number(String(v||'0').replace(/[^\d-]/g,''))||0;const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const settings=()=>state.settings.find(x=>x.id==='main')||{id:'main',rt:'001',rw:'001',name:'RT SMART',showName:true};const say=s=>{const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3200)};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{for(const s of STORE)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function all(s){return new Promise((res,rej)=>{let r=db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(s,obj){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(obj);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function del(s,id){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function refresh(){for(const s of STORE)state[s]=await all(s);header();render()}async function save(s,obj){await put(s,obj);await refresh();say('Tersimpan di perangkat')}async function remove(s,id){if(!confirm('Hapus data ini?'))return;await del(s,id);await refresh()}function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');if(file.size>20*1024*1024)return rej(Error('Maksimal 20 MB per berkas; foto tidak dikompres')); const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(Error('Gagal membaca berkas'));r.readAsDataURL(file)})}function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function header(){let s=settings();$('brandName').textContent=s.showName===false||!s.name?'RT '+(s.rt||'')+' / RW '+(s.rw||''):s.name;$('brandSub').textContent=`RT ${s.rt||'-'} / RW ${s.rw||'-'} • ${s.village||'Isi identitas RT'}`;if(s.logo){$('brandLogo').src=s.logo;$('brandLogo').style.display='block'}else{$('brandLogo').src='icon.svg';$('brandLogo').style.display='block'}}

const menus=['Dashboard','Data Warga','Data Keluarga','Kas RT','Surat','Pengumuman','Arsip','Laporan & Ekspor','Pengaturan','Publikasi'];function render(){ if(!rtIsUnlocked()){rtShowLock();return} $('nav').innerHTML=menus.map(m=>`<button class="${m===section?'active':''}" data-menu="${esc(m)}">${svgIcon(m)} ${m}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.menu;editId=null;render()});let c=$('content');c.innerHTML=({Dashboard:dashboard,'Data Warga':residents,'Data Keluarga':families,'Kas RT':cash,Surat:letters,Pengumuman:announcements,Arsip:archives,'Laporan & Ekspor':reportsPage,Pengaturan:configuration,Publikasi:publication})[section]();bindSection()}

der="Contoh: Surat Keterangan Domisili"></div><div class="field"><label>Isi Template</label><textarea id="templateBody" required rows="12" style="min-height:260px" placeholder="Unggah file atau ketik isi surat">${esc(DEFAULT_TEMPLATE)}</textarea></div><button class="btn" type="submit">Simpan Template Permanen</button><button class="btn alt" id="templateReset" type="button">Tambah Template Baru</button></form><div class="scroll"><table><thead><tr><th>Jenis Surat Tersimpan</th><th>Aksi</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.name)}</td><td><button class="btn alt" data-template-edit="${esc(t.id)}">Edit</button><button class="btn danger" data-template-delete="${esc(t.id)}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="2">Belum ada template tersimpan.</td></tr>'}</tbody></table></div></div>`+rows('letters',[['date','Tanggal'],['kind','Jenis'],['citizen','Warga']])}

function configuration(){let s=settings();return `${rtSecuritySettings()}<div class="panel"><h2>Mode Offline</h2><p class="muted">Data utama disimpan di browser pada perangkat ini. Pekerjaan administrasi dapat dilakukan tanpa internet setelah aplikasi tersedia di perangkat. Untuk pindah perangkat, gunakan Backup Seluruh Data lalu Pulihkan dari file JSON. Jangan hapus data browser atau file backup sebelum pemulihan berhasil diperiksa.</p><div class="notice">Mode ini tidak menyinkronkan data antarperangkat secara otomatis. Dashboard warga online membutuhkan layanan publikasi terpisah dan koneksi internet saat menerbitkan.</div></div><div class="panel"><h2>Identitas RT & Logo</h2><form id="settingsForm">${fields([['rt','Nomor RT'],['rw','Nomor RW'],['name','Nama di samping logo (opsional)'],['village','Desa / Gampong'],['district','Kecamatan'],['city','Kabupaten / Kota'],['province','Provinsi'],['chair','Nama Ketua RT'],['address','Alamat sekretariat','textarea'],['logo','Upload logo RT','file'],['letterhead','Upload gambar kop surat','file']],s)}<label><input type="checkbox" name="showName" ${s.showName!==false?'checked':''}> Tampilkan nama di samping logo</label><p>${s.logo?`<img class="preview" src="${s.logo}" alt="Logo tersimpan">`:''}</p>${s.letterhead?`<p>Pratinjau kop surat:</p><img class="preview" src="${s.letterhead}" alt="Kop surat">`:''}<p><button class="btn">Simpan Identitas RT</button></p></form></div><div id="googleDriveSyncPanel" class="panel"><h2>Sinkronisasi Google Drive</h2><p class="muted">Hubungkan akun Google RT yang sama pada maksimal 3 perangkat. Foto disimpan dalam kualitas asli tanpa kompresi. Sinkronisasi memerlukan internet dan konfigurasi OAuth oleh penjual.</p><div id="driveSyncStatus" class="notice">Belum terhubung.</div><div class="actions"><button class="btn" id="driveConnect" type="button">Hubungkan Google</button><button class="btn alt" id="driveSyncNow" type="button">Sinkronkan Sekarang</button><button class="btn alt" id="driveDownload" type="button">Unduh Salinan Data</button></div><p class="muted">Ketiga perangkat dapat mengedit data yang berbeda. Bila dua perangkat mengedit catatan yang sama sebelum sinkronisasi, aplikasi menghentikan penggabungan agar tidak menimpa perubahan. Google Drive bukan database transaksi real-time.</p></div><div class="panel"><h2>Backup & Pulihkan Data</h2><p class="muted">Backup JSON mencakup dokumen dan foto. File dapat berukuran besar. Simpan di lokasi aman karena memuat data pribadi.</p><button id="backup" class="btn">Unduh Backup Seluruh Data</button><div class="field"><label for="restore">Impor / Pulihkan Backup (.json)</label><button class="btn alt" id="restoreButton" type="button">📂 Impor / Pulihkan Backup</button><input type="file" id="restore" accept=".json,application/json" style="display:none" aria-label="Pilih file backup JSON"><p class="muted" id="restoreHelp">Pilih file backup JSON dari komputer atau HP lain. Data di perangkat ini akan diganti setelah Anda mengonfirmasi.</p></div><p class="notice">Peringatan: pemulihan menggantikan data lokal. Backup saat ini tidak terenkripsi; jangan dibagikan ke pihak lain.</p></div>`}

function bindSection(){rtBindExtras();document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{section=b.dataset.go;editId=null;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();scrollTo(0,0)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await remove(({ 'Data Warga':'residents','Data Keluarga':'families','Kas RT':'cash',Pengumuman:'announcements',Arsip:'archives',Surat:'letters'})[section],b.dataset.del)});if($('cancelEdit'))$('cancelEdit').onclick=()=>{editId=null;render()};if($('entryForm'))$('entryForm').onsubmit=async e=>{e.preventDefault();try{let s=({'Data Warga':'residents','Data Keluarga':'families','Kas RT':'cash',Pengumuman:'announcements',Arsip:'archives'})[section];let fd=new FormData(e.target),obj=state[s].find(x=>x.id===fd.get('id'))||{id:uid()};for(let [k,v] of fd)if(k!=='id'){if(v instanceof File){if(v.size)obj[k]=await fileData(v)}else obj[k]=v}if(s==='cash')obj.amount=num(obj.amount);if(s==='residents'&&obj.nik&&state.residents.some(x=>x.id!==obj.id&&x.nik===obj.nik))throw Error('NIK sudah terdaftar');if(s==='families'&&obj.number&&state.families.some(x=>x.id!==obj.id&&x.number===obj.number))throw Error('Nomor KK sudah terdaftar');await save(s,obj);editId=null}catch(err){alert(err.message)}};if($('settingsForm'))$('settingsForm').onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(e.target),s={...settings()};for(let [k,v] of fd){if(v instanceof File){if(v.size){if(!v.type.startsWith('image/'))throw Error('Logo dan kop harus berupa gambar');s[k]=await fileData(v)}}else s[k]=v}s.showName=e.target.elements.showName.checked;await save('settings',s)}catch(err){alert(err.message)}};if($('backup'))$('backup').onclick=async()=>{try{const data={};for(const s of STORE)data[s]=await all(s);download('rt-smart-backup-'+today()+'.json',new Blob([JSON.stringify({version:3,created:new Date().toISOString(),data})],{type:'application/json'}));say('Backup seluruh data berhasil dibuat')}catch(err){alert('Backup gagal: '+err.message)}};if($('restoreButton'))$('restoreButton').onclick=()=>$('restore').click();if($('restore'))$('restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100*1024*1024)throw Error('File backup terlalu besar (maksimal 100 MB)');const v=JSON.parse(await f.text());if(!v.data||!STORE.every(s=>Array.isArray(v.data[s])))throw Error('Format backup tidak sesuai atau ada bagian data yang hilang');for(const s of STORE){const seen=new Set();for(const obj of v.data[s]){if(!obj||typeof obj!=='object'||typeof obj.id!=='string'||!obj.id||seen.has(obj.id))throw Error('Isi backup tidak valid pada bagian '+s);seen.add(obj.id)}}const summary=STORE.map(s=>s+': '+v.data[s].length).join('\n');if(!confirm('Pulihkan backup dari '+f.name+'?\n\n'+summary+'\n\nSEMUA data pada perangkat ini akan DIGANTI. Lanjutkan untuk membuat cadangan data perangkat ini?'))return;const safety={version:3,created:new Date().toISOString(),data:{}};for(const s of STORE)safety.data[s]=await all(s);download('rt-smart-sebelum-pulihkan-'+today()+'.json',new Blob([JSON.stringify(safety)],{type:'application/json'}));if(!confirm('Pastikan file cadangan perangkat ini sudah terunduh dan tersimpan.\n\nKlik OK untuk MENGGANTI seluruh data perangkat ini dengan file '+f.name+'.'))return;await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('Transaksi gagal'));tx.onabort=()=>reject(tx.error||Error('Pemulihan dibatalkan'));for(const name of STORE){const store=tx.objectStore(name);store.clear();for(const obj of v.data[name])store.put(obj)}});await refresh();alert('Pemulihan berhasil. Periksa jumlah warga, keluarga, dan saldo kas.')}catch(err){alert('Gagal memulihkan backup: '+err.message)}finally{e.target.value=''}};if($('templateFile'))$('templateFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>500000)return alert('File template terlalu besar (maksimal 500 KB)');if(!/\.(txt|html|htm)$/i.test(f.name))return alert('Gunakan file .txt atau .html');let body=await f.text();if(/\.html?$/i.test(f.name)){let doc=new DOMParser().parseFromString(body,'text/html');doc.querySelectorAll('script,style,iframe,object,embed').forEach(n=>n.remove());body=doc.body.innerText||doc.body.textContent||''} $('templateBody').value=body;if(!$('templateName').value)$('templateName').value=f.name.replace(/\.[^.]+$/,'')};
if($('templateForm'))$('templateForm').onsubmit=async e=>{e.preventDefault();let id=$('templateId').value||uid(),name=$('templateName').value.trim(),body=$('templateBody').value.trim();if(!name||!body)return alert('Nama dan isi template wajib diisi');let st={...settings()},list=[...(st.templates||[])],i=list.findIndex(x=>x.id===id),obj={id,name,body};if(i<0)list.push(obj);else list[i]=obj;st.templates=list;await save('settings',st);say('Template tersimpan di perangkat')};

document.querySelectorAll('[data-template-edit]').forEach(b=>b.onclick=()=>{let t=templates().find(x=>x.id===b.dataset.templateEdit);if(!t)return;$('templateId').value=t.id;$('templateName').value=t.name;$('templateBody').value=t.body;$('templateForm').scrollIntoView({behavior:'smooth'})});

if($('letterForm'))$('letterForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),s=settings(),name=String(f.get('citizen')||''),w=state.residents.find(x=>x.name.toLowerCase()===name.toLowerCase());let t=templates().find(x=>x.id===f.get('template'));if(!t)return alert('Pilih template surat yang sudah disimpan');let letter={id:uid(),kind:t.name,citizen:name,purpose:f.get('purpose'),date:f.get('date')||today(),templateId:t.id};let vals={nama:name,nik:w?.nik||'........................',alamat:w?.address||'........................',keperluan:letter.purpose,tanggal:letter.date,rt:s.rt||'',rw:s.rw||'',desa:s.village||'',kecamatan:s.district||'',kabupaten:s.city||'',ketua:s.chair||'........................',jenis:letter.kind};let body=fillTemplate(t.body,vals);let paragraphs=body.split(/\n/).map(line=>`<div style="min-height:1.3em">${esc(line)||'&nbsp;'}</div>`).join('');let html=`<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman';font-size:12pt;margin:3cm"><div style="text-align:center">${s.letterhead?`<img src="${s.letterhead}" style="width:100%;max-height:130px;object-fit:contain">`:`<b>RT ${esc(s.rt)} / RW ${esc(s.rw)}<br>${esc(s.village||'')} ${esc(s.city||'')}</b><hr>`}</div><h3 style="text-align:center;text-decoration:underline">${esc(letter.kind.toUpperCase())}</h3><div style="line-height:1.5">${paragraphs}</div></body></html>`;await put('letters',letter);download('surat-'+letter.id+'.doc',new Blob(['\ufeff'+html],{type:'application/msword'}));await refresh()};if($('publish'))$('publish').onclick=publish;if($('activateLicense'))$('activateLicense').onclick=activateLicense;if($('copyPublic'))$('copyPublic').onclick=()=>{const id=localStorage.getItem('rt-tenant-id')||'',link=new URL('warga.html?rt='+encodeURIComponent(id),location.href).href;navigator.clipboard.writeText(link).then(()=>alert('Link warga disalin')).catch(()=>prompt('Salin link warga:',link))};if($('resetPublication'))$('resetPublication').onclick=()=>{if(confirm('Ganti akun publikasi pada perangkat ini? Data warga dan kas tidak dihapus.')){localStorage.removeItem('rt-tenant-id');localStorage.removeItem('rt-publish-token');render()}}}

const PUBLIC_API=(window.RT_SMART_API||'').replace(/\/$/,'');
async function activateLicense(){const id=($('tenantId')?.value||'').trim().toLowerCase(),token=($('publishToken')?.value||'').trim(),el=$('publishStatus');if(!/^[a-z0-9][a-z0-9-]{2,49}$/.test(id)||! /^[a-f0-9]{64}$/i.test(token)){el.textContent='ID RT atau token tidak sesuai. Minta data aktivasi dari penjual.';return}if(!PUBLIC_API){el.textContent='Server publikasi belum dikonfigurasi.';return}el.textContent='Memeriksa aktivasi...';try{const r=await fetch(PUBLIC_API+'/publish/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(rtPublicPayload())});const d=await r.json();if(!r.ok)throw Error(d.error||'Token tidak valid');localStorage.setItem('rt-tenant-id',id);localStorage.setItem('rt-publish-token',token);render();say('Aktivasi berhasil. Dashboard warga telah dipublikasikan.')}catch(e){el.textContent='Aktivasi gagal: '+e.message}}
function rtPublicPayload(){const s=settings(),income=state.cash.filter(x=>x.type==='Masuk').reduce((a,x)=>a+num(x.amount),0),expense=state.cash.filter(x=>x.type==='Keluar').reduce((a,x)=>a+num(x.amount),0);return {name:s.showName===false?'':s.name||'',rt:s.rt||'',rw:s.rw||'',village:s.village||'',residents:state.residents.length,families:state.families.length,income,expense,announcements:state.announcements.slice(-30).map(x=>({title:String(x.title||'').slice(0,200),body:String(x.body||'').slice(0,2000),date:String(x.date||'').slice(0,20)}))}}
async function publish(){const id=localStorage.getItem('rt-tenant-id'),token=localStorage.getItem('rt-publish-token'),el=$('publishStatus');if(!id||!token){alert('Aktivasi diperlukan.');return}el.textContent='Mengirim ringkasan publik...';try{const r=await fetch(PUBLIC_API+'/publish/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(rtPublicPayload())});const d=await r.json();if(!r.ok)throw Error(d.error||'Publikasi gagal');const link=new URL('warga.html?rt='+encodeURIComponent(id),location.href).href;el.textContent='✓ Berhasil dipublikasikan '+new Date().toLocaleString('id-ID');$('publicLink').innerHTML=`<a href="${esc(link)}" target="_blank" rel="noopener">Buka Dashboard Warga ↗</a>`;say('Dashboard warga berhasil dipublikasikan')}catch(err){el.textContent='Publikasi gagal: '+err.message}}

const RT_PIN_KEY='rt-smart-admin-pin-v1';
let rtUnlocked=false;
function rtPinConfigured(){return !!localStorage.getItem(RT_PIN_KEY)}
function rtIsUnlocked(){return !rtPinConfigured()||rtUnlocked}
async function rtPinDigest(pin){const bytes=new TextEncoder().encode('RT-SMART-LOCAL-PIN:'+pin);const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('')}
function rtShowLock(){let box=document.getElementById('rtLock');if(!box){box=document.createElement('div');box.id='rtLock';box.className='rt-lock';document.body.append(box)}box.innerHTML='<div class="rt-lock-card"><h2>🔒 RT SMART — PIN Admin</h2><p class="muted">Masukkan PIN untuk membuka data pada perangkat ini.</p><form id="rtUnlockForm"><label for="rtUnlockPin">PIN Admin</label><input id="rtUnlockPin" type="password" inputmode="numeric" minlength="4" maxlength="12" required autocomplete="off"><button class="btn">Buka Aplikasi</button></form><p class="muted" id="rtLockMsg">PIN hanya melindungi tampilan aplikasi. Ini bukan enkripsi database atau file backup.</p></div>';document.getElementById('rtUnlockForm').onsubmit=async e=>{e.preventDefault();const pin=document.getElementById('rtUnlockPin').value;const hash=await rtPinDigest(pin);if(hash===localStorage.getItem(RT_PIN_KEY)){rtUnlocked=true;box.remove();render()}else{document.getElementById('rtLockMsg').textContent='PIN salah. Coba lagi.';document.getElementById('rtUnlockPin').value=''}}}
function rtSecuritySettings(){return `<div class="panel"><h2>🔒 Keamanan PIN Admin</h2><p class="muted">PIN mencegah orang membuka tampilan aplikasi tanpa izin pada browser ini. PIN tidak mengenkripsi data browser maupun backup JSON. Simpan backup dengan aman.</p><p><b>Status:</b> ${rtPinConfigured()?'PIN aktif':'PIN belum diaktifkan'}</p><form id="rtPinForm"><div class="field"><label>PIN lama (isi jika mengganti atau menghapus)</label><input name="old" type="password" inputmode="numeric" autocomplete="off"></div><div class="field"><label>PIN baru (4–12 angka)</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" placeholder="4–12 angka" autocomplete="new-password"></div><div class="actions"><button class="btn" type="submit">Simpan / Ganti PIN</button>${rtPinConfigured()?'<button class="btn alt" id="rtDisablePin" type="button">Nonaktifkan PIN</button><button class="btn alt" id="rtLockNow" type="button">Kunci Sekarang</button>':''}</div></form><p class="notice">Jika PIN lupa, jangan hapus data situs. Gunakan backup yang telah Anda simpan dan minta bantuan pemulihan.</p></div>`}
function rtMonthRows(){let month=document.getElementById('rtMonth')?.value||new Date().toISOString().slice(0,7);return state.cash.filter(x=>String(x.date||'').startsWith(month)).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))}
function rtCsvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function rtCsv(name,columns,items){const lines=[columns.map(c=>rtCsvCell(c[1])).join(',')];for(const item of items)lines.push(columns.map(([k])=>rtCsvCell(item[k])).join(','));download(name,new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}))}
function reportsPage(){const month=new Date().toISOString().slice(0,7);return `<div class="panel"><h2>Laporan Kas RT Bulanan</h2><p class="muted">Pilih bulan lalu cetak atau simpan PDF melalui menu cetak browser. Data kas tetap tersimpan lokal.</p><div class="field"><label for="rtMonth">Bulan laporan</label><input id="rtMonth" type="month" value="${month}"></div><div class="actions"><button class="btn" id="rtPrintCash">Cetak / Simpan PDF</button><button class="btn alt" id="rtExportCash">Ekspor Kas Bulan Ini (CSV)</button></div><div id="rtCashReport" class="rt-print-area"></div></div><div class="panel"><h2>Ekspor Data Warga & Keluarga</h2><p class="muted">File CSV dapat dibuka di Excel. Berisi data pribadi; jangan diunggah ke repository publik.</p><div class="actions"><button class="btn" id="rtExportResidents">Unduh Data Warga (CSV)</button><button class="btn alt" id="rtExportFamilies">Unduh Data KK (CSV)</button></div></div>`}
function rtUpdateCashReport(){const target=document.getElementById('rtCashReport');if(!target)return;const items=rtMonthRows(),income=items.filter(x=>x.type==='Masuk').reduce((a,x)=>a+num(x.amount),0),expense=items.filter(x=>x.type==='Keluar').reduce((a,x)=>a+num(x.amount),0),month=document.getElementById('rtMonth').value,opening=state.cash.filter(x=>String(x.date||'')<month+'-01').reduce((a,x)=>a+(x.type==='Masuk'?num(x.amount):-num(x.amount)),0);target.innerHTML=`<h3>Laporan Kas RT ${esc(settings().rt||'')} / RW ${esc(settings().rw||'')}</h3><p>Periode: ${esc(month)} | ${esc(settings().village||'')}</p><p><b>Saldo Awal:</b> ${money(opening)} &nbsp; <b>Masuk:</b> ${money(income)} &nbsp; <b>Keluar:</b> ${money(expense)} &nbsp; <b>Saldo Akhir:</b> ${money(opening+income-expense)}</p><div class="scroll"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada transaksi bulan ini.</td></tr>'}</tbody></table></div><p class="rt-print-only" style="margin-top:50px">Ketua RT, ____________________</p>`}
function rtBindExtras(){const pinForm=document.getElementById('rtPinForm');if(pinForm)pinForm.onsubmit=async e=>{e.preventDefault();const fd=new FormData(pinForm),old=String(fd.get('old')||''),pin=String(fd.get('pin')||'');if(!/^[0-9]{4,12}$/.test(pin))return alert('PIN harus 4–12 angka');if(rtPinConfigured()&&await rtPinDigest(old)!==localStorage.getItem(RT_PIN_KEY))return alert('PIN lama salah');localStorage.setItem(RT_PIN_KEY,await rtPinDigest(pin));rtUnlocked=true;render();say('PIN admin tersimpan')};const disable=document.getElementById('rtDisablePin');if(disable)disable.onclick=async()=>{const old=prompt('Masukkan PIN lama untuk menonaktifkan:');if(old===null)return;if(await rtPinDigest(old)!==localStorage.getItem(RT_PIN_KEY))return alert('PIN salah');if(!confirm('Nonaktifkan PIN di perangkat ini?'))return;localStorage.removeItem(RT_PIN_KEY);rtUnlocked=false;render()};const lock=document.getElementById('rtLockNow');if(lock)lock.onclick=()=>{rtUnlocked=false;rtShowLock()};const month=document.getElementById('rtMonth');if(month){month.onchange=rtUpdateCashReport;rtUpdateCashReport();document.getElementById('rtPrintCash').onclick=()=>window.print();document.getElementById('rtExportCash').onclick=()=>rtCsv('kas-rt-'+month.value+'.csv',[['date','Tanggal'],['type','Jenis'],['category','Kategori'],['amount','Nominal'],['note','Keterangan']],rtMonthRows());document.getElementById('rtExportResidents').onclick=()=>rtCsv('data-warga-'+today()+'.csv',[['name','Nama'],['nik','NIK'],['family','Nomor KK'],['relation','Hubungan'],['birth','Tanggal Lahir'],['gender','Jenis Kelamin'],['job','Pekerjaan'],['phone','Nomor HP'],['address','Alamat']],state.residents);document.getElementById('rtExportFamilies').onclick=()=>rtCsv('data-kk-'+today()+'.csv',[['number','Nomor KK'],['head','Kepala Keluarga'],['address','Alamat']],state.families)}const citizen=document.getElementById('f_citizen');if(citizen&&document.getElementById('letterForm')){citizen.setAttribute('list','rtCitizenOptions');const update=()=>{const w=state.residents.find(x=>x.name.toLowerCase()===citizen.value.trim().toLowerCase());document.getElementById('rtCitizenInfo').textContent=w?'NIK: '+(w.nik||'-')+' | Alamat: '+(w.address||'-')+' — otomatis digunakan dalam surat.':'Nama belum ditemukan di Data Warga. NIK dan alamat tidak akan terisi otomatis.'};citizen.addEventListener('input',update)}}

window.addEventListener('error',function(e){const c=document.getElementById('content');if(c&&!c.textContent.trim())c.innerHTML='<div class="panel"><h2>Aplikasi gagal dimuat</h2><p>Jangan hapus data browser. Muat ulang saat terhubung internet atau gunakan file backup untuk pemulihan di perangkat lain.</p></div>';});
(async()=>{try{db=await openDB();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(err){$('content').innerHTML=`<div class="panel"><h2>Gagal membuka penyimpanan</h2><p>${esc(err.message)}</p><p>Gunakan HTTPS/GitHub Pages dan pastikan penyimpanan situs diizinkan. Jangan hapus data situs sebelum backup.</p></div>`}})();
</script></body></html>
